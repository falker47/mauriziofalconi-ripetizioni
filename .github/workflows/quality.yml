name: site-quality

on:
  push:
    branches:
      - master
      - gpr/rebuild-ripetizioni
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate static site
        run: python scripts/check_site.py
